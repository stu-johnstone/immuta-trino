# Apache Iceberg catalog backed by the local Iceberg REST catalog service.
connector.name=iceberg

iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181

# The warehouse lives on the ./data/warehouse bind mount, which is mounted at
# the same path (/warehouse) in both Trino and the catalog service.
#
# Use the Hadoop file system for file:// URIs. Do NOT use
# fs.native-local.enabled here: that filesystem resolves every file:// path
# under a sandbox root (/tmp by default), so Trino would silently write the
# Parquet data into the container filesystem and lose it on restart, while the
# catalog service wrote metadata to the real bind mount.
fs.hadoop.enabled=true

iceberg.file-format=PARQUET
