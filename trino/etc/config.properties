# Single-node Trino coordinator for local Immuta integration testing.
# Not a production configuration.
coordinator=true
node-scheduler.include-coordinator=true

# Container-internal port. Change the published host port with
# TRINO_HTTP_PORT in .env instead of editing this value.
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Required when Trino is reached through the cloudflared tunnel: Trino
# honours X-Forwarded-* headers so the URIs it hands back to clients (such
# as Immuta and the Trino JDBC driver) point at the tunnel hostname over
# HTTPS instead of http://localhost:8080.
http-server.process-forwarded=true

# No authentication is configured on purpose. The test usernames are
# logical request identities only - see README.md > Test users.
