# Trino's built-in file-based system access control.
#
# Coarse-grained, per-username table and catalog permissions, applied BEFORE
# any Immuta policy. The rules themselves live in rules.json, which is a bind
# mount: edit it on the host and Trino reloads it within
# security.refresh-period - no restart needed.
access-control.name=file
security.config-file=/etc/trino/access-control/rules.json
security.refresh-period=10s
