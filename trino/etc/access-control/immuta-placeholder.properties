# Placeholder for the Immuta entry in access-control.config-files.
#
# Trino needs every file listed in access-control.config-files to exist, so
# the base stack mounts this no-op over /etc/trino/access-control/immuta.properties.
# docker-compose.immuta.yml replaces it with the real, generated
# immuta-access-control.properties once the plugin and config are installed.
#
# allow-all defers every decision to the other access control in the chain
# (the file-based rules), so this file changes nothing on its own.
access-control.name=allow-all
