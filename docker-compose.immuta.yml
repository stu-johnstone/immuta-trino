# ---------------------------------------------------------------------------
# Overlay that enables Immuta access control inside Trino.
#
# The Makefile includes this file automatically once BOTH of these exist:
#   immuta/plugin/*.jar                      the Immuta Trino plugin
#   immuta/immuta-access-control.properties  generated by Immuta
#
# Run `make install-immuta-config FILE=~/Downloads/immuta-access-control.properties`
# then `make restart`. Check the active mode with `make status`.
#
# Both paths are gitignored: the properties file contains an Immuta API key
# and must never be committed.
# ---------------------------------------------------------------------------
services:
  trino:
    volumes:
      - ./immuta/plugin:/usr/lib/trino/plugin/immuta:ro
      # Takes over the Immuta slot of access-control.config-files (see
      # trino/etc/config.properties) from the allow-all placeholder that the
      # base stack mounts there. Compose merges volumes by target path, so
      # this replaces the placeholder rather than adding a second mount.
      # Immuta's file sets access-control.name=immuta.
      - ./immuta/immuta-access-control.properties:/etc/trino/access-control/immuta.properties:ro
